# Authoritative label registry for the harn-adventures repository.
#
# GitHub's labels are reconciled to this file by the org-wide labels action, run
# by .github/workflows/labels-sync.yml. The set is CLOSED: any label on GitHub
# that is not listed here is deleted on sync. Do not invent labels — extending
# the registry is a deliberate edit to this file.
#
# The registry is deliberately narrow: this repository ships Foundry compendium
# packs and their assets, and nothing else — no system code, no test suite, and
# no site — so `system`, `tests`, and `site` are absent.

- name: content
  color: "58ec8d"
  description: Adventure material — adventures, journals, scenes, maps, actors, roll tables, artwork.

- name: documentation
  color: "0075ca"
  description: Documentation about this repository — README, process, authoring guides.

- name: devops
  color: "e07b31"
  description: Build, tooling, pack pipeline, release, repo config.

- name: security
  color: "b60205"
  description: "Attack surface: data integrity, script execution, injection, or private-disclosure risk."

- name: tech-debt
  color: "68691b"
  description: Restructuring or cleanup of working content or tooling; refactors.

- name: regression
  color: "d93f0b"
  description: Something that previously worked and stopped. Pairs with type bug.

- name: breaking-change
  color: "8d0f09"
  description: Alters a document ID, pack name, or compatibility in a way existing worlds will notice.

- name: blocked
  color: "c5702e"
  description: Cannot proceed until an external dependency or another issue clears.

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists.

- name: question
  color: "0f5594"
  description: Further information is requested.

- name: wontfix
  color: "ffffff"
  description: This will not be worked on.
