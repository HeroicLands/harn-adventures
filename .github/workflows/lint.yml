# Lint the tree on every pull request (#17).
#
# This runs `npm run lint`, which is the whole of what a repository shaped like
# this one can be wrong about: its prose formatting, its markdown structure, its
# addresses, and whether its links land.
#
# It became the whole chain in #20. Until then the gate ran three of the four
# checks and held `lint:addresses` back, because the address linter read this
# repository's homepage-only content tree as an empty one and failed. That was a
# defect in the guard rather than a finding about this tree
# (HeroicLands/package-build#77, fixed in #80), and adopting package-build 6.0.0
# is what retired the exception.
#
# Nothing here builds or compiles a pack. Every check reads the tree directly,
# so this gate does not depend on `build:noci` and does not go red when the pack
# compile does.
name: Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Formatting, markdown, addresses, and links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The checks need only the toolchain; nothing here builds.
      - name: Install dependencies
        run: npm ci

      # `run-s lint:format lint:markdown lint:addresses lint:content-links`
      # — the shared Prettier configuration (`assets/packs/` excluded in
      # `.prettierignore`, because that JSON is written by the compendium
      # tooling at a 2-space indent the shared config would fight
      # forever), the shared markdownlint rule set, the address and
      # frontmatter rules, and every anchor and qualified address.
      # `run-s` stops at the first failure, so the log names the check
      # that went red.
      - name: Lint
        run: npm run lint
