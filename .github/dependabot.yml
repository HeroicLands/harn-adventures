# Dependabot version updates.
#
# Labels are pinned to `devops` deliberately. Dependabot's own default label is
# `dependencies`, which is not in `.github/labels.yml` — and that registry is a
# closed set, so `labels-sync.yml` would delete the label again on the next push
# to `main`. Naming a managed label keeps the two from fighting.
#
# Only the `github-actions` ecosystem is watched. This repository ships content
# and assets; it has no package manifest, so there is nothing for an `npm`
# entry to resolve. Add one when a build toolchain lands here.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      labels:
          - devops
      groups:
          github-actions:
              patterns:
                  - "*"
              update-types:
                  - minor
                  - patch
