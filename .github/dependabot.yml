# Dependabot version updates.
#
# Labels are pinned to `devops` deliberately. Dependabot's own default label is
# `dependencies`, which is not in `.github/labels.yml` — and that registry is a
# closed set, so `labels-sync.yml` would delete the label again on the next push
# to `main`. Naming a managed label keeps the two from fighting.
#
# A package.json landed in #17, so the npm ecosystem now has something to
# resolve. `@heroiclands/package-build` and `@heroiclands/hugo-theme` are each
# their own ungrouped single-package entry, ordered ahead of the housekeeping
# catch-all. Both sit below 1.0, where a **minor** bump is the breaking
# release — `0.4.0` to `0.5.0` is the break, and the major-bump rule that would
# otherwise isolate only majors never fires, because `1.0.0` never arrives. So
# neither may be swept into a grouped pull request for any update type, and
# the two are kept apart from each other as well, because a toolchain break
# and a layout break are separate decisions. See #22.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - devops
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # First-party packages, ahead of everything: each is its own decision and
      # neither may be swept into a grouped housekeeping pull request. A group
      # of one still yields one pull request per package, which is the point.
      # Dependabot assigns a dependency to the first group it matches, so the
      # order of these entries is what does the work.
      package-build:
        patterns:
          - "@heroiclands/package-build"
      hugo-theme:
        patterns:
          - "@heroiclands/hugo-theme"
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - devops
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
