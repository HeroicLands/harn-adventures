# This module ships fourteen finished Adventure documents rather than a content
# tree, so `packs[].prebuilt` points the compile at the already-built JSON.

# `contentPackage` is `harnadventures`, without the hyphen `foundryPackage`
# keeps (`harn-adventures`, from `package.json`) — a hyphen here would break
# address parsing, which treats `-` purely as a segment separator.
contentPackage: harnadventures
packageKind: modules

stats:
    # No `systemId` and no `relationships.systems`: Foundry's
    # `_testSupportedSystems` returns true only for a package that declares no
    # systems, so naming `hm3` and `sohl` here would hide this module from any
    # other system, and the maps, journals and tables carry no system data.
    # The package stamps no system version either.
    lastModifiedBy: harnadvbuild0000

compatibility:
    minimum: "12"
    verified: "14"

# One pack, and it declares no `system`: an Adventure pack that names one is
# hidden from every other system. `Adventure.fromSource()` silently empties
# `actors` and `items` when a pack declares none, so actors are kept out of
# these documents entirely and ship from their own per-system Actor packs.
packs:
    - name: adventures
      label: Adventures
      type: Adventure
      prebuilt: assets/packs/adventure

# Both switches are a licensing decision, not a consequence of having nothing to
# publish: this content is HârnFanon under Lythia's terms, so none of it —
# journal text, artwork, item descriptions, compiled notes — is ever published
# to heroiclands.org. `site: homepage` is what enforces that boundary in code
# rather than leaving it to a configuration that happens to be empty.
#
# The homepage at https://www.heroiclands.org/harnadventures/ is authored as
# `assets/content/homepage.md`, the only page this build emits; naming the
# module there discloses nothing licensed and creates no dependency.
publish:
    site: homepage

# The "page not found" wording: this is a one-page site, so every route below
# but the first leaves for somewhere else — the honest answer rather than a
# padded one.
site:
    assets: https://cdn.heroiclands.org
    description: Fourteen ready-to-play adventures for HârnWorld, adapted from fan-written works published on Lythia.com.
    notfound:
        tagline: This module has one page, and it is not at
        sitenoun: module
        links:
            - title: Hârn Adventures
              url: /
              text: What this module carries, and how to install it.
            - title: Modules
              url: https://www.heroiclands.org/projects/modules/
              text: The other modules published here.
            - title: Lythia.com
              url: https://www.lythia.com/
              text: The fan site the works adapted here were published on.

packageBuild:
    assets:
        - { from: assets/hm-adv-br, to: assets/hm-adv-br }
        - { from: assets/hm-adv-sos, to: assets/hm-adv-sos }
        - { from: assets/hm-cpn-earlsprogress, to: assets/hm-cpn-earlsprogress }
        - { from: assets/hm-loc-charmic, to: assets/hm-loc-charmic }
        - { from: assets/hm-loc-chewintin, to: assets/hm-loc-chewintin }
        - { from: assets/hm-loc-drilen, to: assets/hm-loc-drilen }
        - { from: assets/hm-loc-emerule, to: assets/hm-loc-emerule }
        - { from: assets/hm-loc-erone, to: assets/hm-loc-erone }
        - { from: assets/hm-loc-getha, to: assets/hm-loc-getha }
        - { from: assets/hm-loc-hundholt, to: assets/hm-loc-hundholt }
        - { from: assets/hm-loc-jedes, to: assets/hm-loc-jedes }
        - { from: assets/hm-loc-ko, to: assets/hm-loc-ko }
        - { from: assets/hm-loc-lethyl, to: assets/hm-loc-lethyl }
        - { from: assets/hm-loc-ominstru, to: assets/hm-loc-ominstru }
        - { from: assets/hm-loc-sbi, to: assets/hm-loc-sbi }
        - { from: assets/hm-loc-tbb, to: assets/hm-loc-tbb }
        - { from: LICENSE, to: LICENSE }
        - { from: README.md, to: README.md }

    manifest:
        title: Hârn Adventures
        descriptionHtml: >-
            Fourteen ready-to-play adventures for HârnWorld, adapted from
            fan-written works published on Lythia.com. Maps, journals and
            roll tables carry no system data and import into any game system.
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE
        readme: README.md
        packFolders:
            - name: Hârn Adventures
              sorting: m
              color: "#5b2c1d"
              packs:
                  - adventures
        flags:
            allowBugReporter: true
